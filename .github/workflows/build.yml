name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www
          for f in index.html android-bridge.js cloud-sync.js archive-conso.js sw.js manifest.json icon-192.png icon-512.png sidikacem-map.json; do
            [ -f "$f" ] && cp "$f" www/ || true
          done
          # Synchronisation cloud : chargée juste après le pont Android (le build échoue si la balise manque)
          grep -q '<script src="./android-bridge.js"></script>' www/index.html
          sed -i 's#<script src="./android-bridge.js"></script>#&\n    <script src="./cloud-sync.js"></script>#' www/index.html
          grep -q 'cloud-sync.js' www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm install @capacitor/assets --no-save
          npx @capacitor/assets generate --android

      - name: Add permissions
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          """
          s = s.replace("<application", perms + "\n    <application", 1)
          # Verrouillage PORTRAIT définitif (aucune rotation, même téléphone incliné)
          import re
          s = re.sub(r'\s+android:screenOrientation="[^"]*"', '', s)
          s = s.replace("<activity", '<activity android:screenOrientation="portrait"', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Native plugin, fixed signing key and version number
        run: |
          # 1) Plugin natif « SaveFile » : enregistre les exports dans Téléchargements/SmartRV
          APPID=$(node -p "require('./capacitor.config.json').appId")
          pkg=android/app/src/main/java/$(echo "$APPID" | tr . /)
          mkdir -p "$pkg"
          cp native/SaveFilePlugin.java native/MainActivity.java "$pkg/"
          sed -i "s/^package .*;/package $APPID;/" "$pkg/SaveFilePlugin.java" "$pkg/MainActivity.java"
          grep -n "^package" "$pkg"/*.java
          # 2) Clé de signature FIXE : même signature à chaque build => Android accepte la mise à jour
          #    par-dessus l'ancienne version sans désinstaller (sinon : « Conflit avec un package existant »)
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          # 2b) Signature FORCÉE dans Gradle (copier le fichier dans ~/.android ne suffisait pas : l'APK sortait
          #     signé avec une clé aléatoire différente à chaque build)
          python3 native/add_signing.py
          grep -n -A8 "signingConfigs" android/app/build.gradle
          # 3) Numéro de version TOUJOURS croissant (secondes depuis le 01/01/2026) : toujours supérieur à toute
          #    ancienne version, même construite par un autre dépôt ou un autre compteur (sinon Android refuse
          #    la mise à jour : « version plus récente déjà installée »). Reste très en dessous de la limite (2,1 milliards).
          VC=$(( $(date +%s) - 1767225600 ))
          sed -i "s/versionCode 1$/versionCode $VC/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q "versionCode $VC" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify signing key and version
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          EXPECTED=$(keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey | grep -i -o 'SHA-\?256)\?: *[0-9A-F:]*' | head -1 | sed 's/^[^:]*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Empreinte attendue (clé fixe) : $EXPECTED"
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
            ACTUAL=$(grep -i 'certificate SHA-256' signer.txt | head -1 | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')
            echo "Empreinte de l'APK            : $ACTUAL"
            if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::L'APK n'est PAS signé avec la clé fixe : la mise à jour par-dessus l'ancienne version sera refusée."
              exit 1
            fi
          else
            echo "::warning::apksigner introuvable : signature non vérifiée"
          fi
          [ -x "$BT/aapt2" ] && "$BT/aapt2" dump badging "$APK" | head -1 || true
          cp "$APK" "android/app/build/outputs/apk/debug/SmartRV-v1.${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartRV-apk
          path: android/app/build/outputs/apk/debug/SmartRV-v1.${{ github.run_number }}.apk
