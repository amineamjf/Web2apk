name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www
          for f in index.html android-bridge.js sw.js manifest.json icon-192.png icon-512.png sidikacem-map.json; do
            [ -f "$f" ] && cp "$f" www/ || true
          done

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm install @capacitor/assets --no-save
          npx @capacitor/assets generate --android

      - name: Add permissions
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          """
          s = s.replace("<application", perms + "\n    <application", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Native plugin, fixed signing key and version number
        run: |
          # 1) Plugin natif « SaveFile » : enregistre les exports dans Téléchargements/SmartRV
          APPID=$(node -p "require('./capacitor.config.json').appId")
          pkg=android/app/src/main/java/$(echo "$APPID" | tr . /)
          mkdir -p "$pkg"
          cp native/SaveFilePlugin.java native/MainActivity.java "$pkg/"
          sed -i "s/^package .*;/package $APPID;/" "$pkg/SaveFilePlugin.java" "$pkg/MainActivity.java"
          grep -n "^package" "$pkg"/*.java
          # 2) Clé de signature FIXE : même signature à chaque build => Android accepte la mise à jour
          #    par-dessus l'ancienne version sans désinstaller (sinon : « Conflit avec un package existant »)
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          # 3) Numéro de version croissant à chaque build (exigé par Android pour une mise à jour)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartRV-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
