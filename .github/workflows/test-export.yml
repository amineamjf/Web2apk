name: Test export Excel
on:
  workflow_dispatch:
  push:
    branches: [feat/smart-import]
    paths: ['index.html','tests/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save xlsx-js-style@1.2.0
      - run: node tests/export_test.js
      - uses: actions/upload-artifact@v4
        with: { name: export-test, path: export-test.xlsx }
