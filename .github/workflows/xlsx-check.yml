name: Xlsx check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install playwright
        run: |
          npm install playwright@1.48.2 --no-save
          npx playwright install --with-deps chromium
      - name: Generate export (synthetic data)
        run: node tests/xlsxcheck.js
      - name: Validate XML parts
        run: python3 tests/xlsxcheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: export-sample, path: out/export.xlsx }
